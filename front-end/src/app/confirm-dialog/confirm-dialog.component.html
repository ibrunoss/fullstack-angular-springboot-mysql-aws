<div>
  <mat-card class="confirm-dialog-container">
    <mat-card-header *ngIf="title" class="confirm-dialog-header">
      <mat-card-title>{{ title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content *ngIf="message" class="confirm-dialog-content">
      <p>{{ message }}</p>
    </mat-card-content>
    <mat-card-actions class="confirm-dialog-actions">
      <button mat-button [color]="confirmColor" (click)="confirm()">
        {{ confirmText }}
      </button>
      <button mat-button [color]="cancelColor" (click)="cancel()">
        {{ cancelText }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
