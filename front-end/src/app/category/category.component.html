<div class="category-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title> Gerenciar Categorias </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table
        id="table-category"
        mat-table
        [dataSource]="categories"
        class="mat-elevation-z8"
      >
        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

        <!-- Position Column -->
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef>Pos.</th>
          <td mat-cell *matCellDef="let category; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let category">{{ category.name }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td
            mat-cell
            *matCellDef="let category"
            class="table-category-actions-td"
          >
            <button
              mat-raised-button
              color="accent"
              (click)="editCategory(category)"
            >
              Editar
            </button>
            <button
              mat-raised-button
              color="warn"
              (click)="deleteCategory(category)"
            >
              Apagar
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </mat-card-content>
    <mat-card-actions>
      <a mat-raised-button color="warn" routerLink="/">Home</a>
      <button mat-raised-button color="primary" (click)="createNewCategory()">
        Criar nova categoria
      </button>
    </mat-card-actions>
  </mat-card>
</div>
